[project]
name = "pizza-crm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "K4DJee", email = "mishchenkodima24@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "aiogram>=3.31.0",
    "aiohappyeyeballs>=2.7.1",
    "aiohttp>=3.14.4",
    "aiosmtplib>=5.1.3",
    "alembic>=1.19.2",
    "attrs>=26.1.0",
    "bcrypt>=5.0.0",
    "blinker>=1.9.0",
    "cffi>=2.1.1",
    "cryptography>=50.0.2",
    "fastapi-mail>=1.6.8",
    "fastapi[standard]>=0.141.1",
    "frozenlist>=1.8.0",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "magic-filter>=1.0.12",
    "multidict>=6.9.1",
    "passlib>=1.7.4",
    "propcache>=0.5.4",
    "psycopg>=3.3.6",
    "psycopg-binary>=3.3.6",
    "pyjwt>=2.15.1",
    "pytest>=9.1.1",
    "redis>=8.1.0",
    "regex>=2026.9.29",
    "sqlalchemy>=2.0.52",
    "yarl>=1.25.1",
]

[project.scripts]
pizza-crm = "pizza_crm:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
