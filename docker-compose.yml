version: '3.8'

services:
  # API Gateway - единственная точка входа
  gateway:
    build: ./gateway
    ports:
      - "80:80"  # Клиенты стучатся на порт 80
    depends_on:
      - auth_service
      - catalog_service
    environment:
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL}
      JWT_ACCESS_SECRET_KEY: ${JWT_ACCESS_SECRET_KEY}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}

  # Auth Service - внутренний сервис
  auth_service:
    build: ./auth_service
    expose:
      - "8000"  # Не открываем наружу, только внутри Docker-сети
    environment:
      JWT_ACCESS_SECRET_KEY: ${JWT_ACCESS_SECRET_KEY}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      DATABASE_AUTH_URL: ${DATABASE_AUTH_URL}
      REDIS_URL: ${REDIS_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
    depends_on:
      - auth_db

  notification_service:
    build: ./notification_service
    expose:
      - "8000"  # Не открываем наружу, только внутри Docker-сети
    environment:
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_SERVER: ${MAIL_SERVER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

  catalog_service:
    build: ./catalog_service
    expose:
      - "8000"  # Не открываем наружу, только внутри Docker-сети
    environment:
      DATABASE_CATALOG_URL: ${DATABASE_CATALOG_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
    depends_on:
     - catalog_db

  kitchen_service:
    build: ./kitchen_service
    expose:
      - "8000"  # Не открываем наружу, только внутри Docker-сети
    environment:
      DATABASE_KITCHEN_URL: ${DATABASE_KITCHEN_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL}
    depends_on:
     - kitchen_db

  order_service:
    build: ./order_service
    expose:
      - "8000"  # Не открываем наружу, только внутри Docker-сети
    environment:
      DATABASE_ORDER_URL: ${DATABASE_ORDER_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL}
      KITCHEN_SERVICE_URL: ${KITCHEN_SERVICE_URL}
    depends_on:
     - order_db


  auth_db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_AUTH_DB}
      POSTGRES_USER: ${POSTGRES_AUTH_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
    ports:
      - "5432:5432"  # Для локальной разработки
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  catalog_db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_CATALOG_DB}
      POSTGRES_USER: ${POSTGRES_CATALOG_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CATALOG_PASSWORD}
    ports:
      - "5433:5433"
    volumes:
      - catalog_db_data:/var/lib/postgresql/data

  kitchen_db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_KITCHEN_DB}
      POSTGRES_USER: ${POSTGRES_KITCHEN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_KITCHEN_PASSWORD}
    ports:
      - "5434:5434"
    volumes:
      - kitchen_db_data:/var/lib/postgresql/data

  order_db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_ORDER_DB}
      POSTGRES_USER: ${POSTGRES_ORDER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ORDER_PASSWORD}
    ports:
      - "5435:5435"
    volumes:
      - order_db_data:/var/lib/postgresql/data

    
    
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  auth_db_data:
  catalog_db_data:
  kitchen_db_data:
  order_db_data: